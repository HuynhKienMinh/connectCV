name: ConnectCV independent checks
'on':
  push:
    branches: [main, 'improvement/**']
    paths-ignore: ['docs/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: connectcv-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --omit=dev
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: 'https://connectcv-api-minh.onrender.com'
      - run: node --test tests/authFlow.test.js tests/googleAuthFlow.test.js tests/portfolioLoader.test.js tests/productionApi.test.js
        working-directory: frontend
      - run: node --test tests/account.test.cjs tests/communityFaults.test.cjs tests/communityReceipt.test.cjs tests/communityHttp.test.cjs tests/chatbotHttp.test.cjs tests/portfolio.test.cjs tests/portfolioAuthHttp.test.cjs tests/profileConflict.test.cjs tests/renderBrowser.test.cjs
        working-directory: backend
      - run: npm test
        working-directory: backend/features/connectcv
      - run: npm audit --audit-level=moderate
        working-directory: backend
      - run: npm audit --audit-level=moderate
        working-directory: frontend
      - run: npm audit --audit-level=moderate
        working-directory: backend/features/connectcv
  pdf-renderer:
    # Chromium's user namespace sandbox needs a compatible host policy.
    # Keep sandbox enabled; do not disable AppArmor or change host sysctls.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --omit=dev
        working-directory: backend
      - run: npm ci --omit=dev
        working-directory: backend/features/connectcv
      - run: npm ci
        working-directory: frontend
      - name: Install pinned Chromium for sandboxed PDF verification
        run: node node_modules/playwright-core/cli.js install --with-deps --no-shell chromium
        working-directory: backend/features/connectcv
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
      - name: Verify production sandbox, isolated resources and PDF text
        run: node tests/pdfRenderer.check.cjs
        working-directory: backend/features/connectcv
        env:
          NODE_ENV: production
          PLAYWRIGHT_BROWSERS_PATH: '0'
      - name: Verify mobile Google login guards and recovery with synthetic SDK
        run: node tests/googleAuthUi.check.mjs
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
          AUTH_UI_QA_OUTPUT: '${{ runner.temp }}/connectcv-auth-qa'
      - name: Verify email/reset route lifecycle, late results and duplicate submission
        run: node tests/authRequestUi.check.mjs
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
          AUTH_REQUEST_QA_OUTPUT: '${{ runner.temp }}/connectcv-auth-request-qa'
      - name: Verify AccountPage load, version conflicts and actor operation ownership
        run: node tests/accountLifecycleUi.check.mjs
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
          ACCOUNT_UI_QA_OUTPUT: '${{ runner.temp }}/connectcv-account-lifecycle-qa'
      - name: Verify React iframe token boundaries, account changes and obsolete document requests
        run: node tests/featureBridgeUi.check.mjs
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
          FEATURE_BRIDGE_QA_OUTPUT: '${{ runner.temp }}/connectcv-feature-bridge-qa'
      - name: Verify readiness recovery after browser re-creation
        run: node tests/rendererReconnect.check.cjs
        working-directory: backend/features/connectcv
        env:
          NODE_ENV: production
          PLAYWRIGHT_BROWSERS_PATH: '0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent PDF text verifier
        run: python -m pip install pypdf==6.10.0
      - name: Compare native font geometry, crop and pagination
        run: node tests/nativeFontPdf.check.cjs
        working-directory: backend/features/connectcv
        env:
          NODE_ENV: production
          PLAYWRIGHT_BROWSERS_PATH: '0'
          CV_FONT_QA_OUTPUT: '${{ runner.temp }}/connectcv-font-qa'
      - name: Verify exact Vietnamese words with independent parser
        run: python tests/nativeFontText.check.py "$CV_FONT_QA_OUTPUT"
        working-directory: backend/features/connectcv
        env:
          CV_FONT_QA_OUTPUT: '${{ runner.temp }}/connectcv-font-qa'
      - name: Verify native role fields and long-title wrapping
        run: node tests/nativeTitlePdf.check.cjs
        working-directory: backend/features/connectcv
        env:
          NODE_ENV: production
          PLAYWRIGHT_BROWSERS_PATH: '0'
          CV_TITLE_QA_PHASE: ci
          CV_TITLE_QA_OUTPUT: '${{ runner.temp }}/connectcv-title-qa'
      - name: Verify source facts in all eight role-field PDFs
        run: python tests/nativeTitleText.check.py "${{ runner.temp }}/connectcv-title-qa"
        working-directory: backend/features/connectcv

      - name: Verify responsive preview and edited photo round trip
        run: node tests/cvPreview.check.cjs
        working-directory: backend/features/connectcv
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
          CV_PREVIEW_QA_OUTPUT: '${{ runner.temp }}/connectcv-preview-qa'
      - name: Verify canonical photo layout in sandboxed PDF exports
        run: node tests/cvPhotoPdf.check.cjs
        working-directory: backend/features/connectcv
        env:
          NODE_ENV: production
          PLAYWRIGHT_BROWSERS_PATH: '0'
      - name: Verify synthetic matching cards and selection for ten industries
        run: node tests/jobMatchingUi.check.cjs
        working-directory: backend/features/connectcv
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
          JOB_UI_QA_OUTPUT: '${{ runner.temp }}/connectcv-job-qa'
      - name: Verify large portrait saving, retained drafts and profile conflicts
        run: node tests/profileImageUi.check.cjs
        working-directory: backend/features/connectcv
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
          PROFILE_IMAGE_QA_OUTPUT: '${{ runner.temp }}/connectcv-profile-image-qa'
      - name: Verify chatbot clear, logout, late responses and responsive browser lifecycle
        run: node tests/chatbotUi.check.cjs
        working-directory: backend/features/connectcv
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
          CHAT_BROWSER_QA_OUTPUT: '${{ runner.temp }}/connectcv-chatbot-qa'
      - name: Verify portfolio saves preserve newer drafts and ignore obsolete account operations
        run: node tests/portfolioSaveUi.check.mjs
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
          PORTFOLIO_UI_QA_OUTPUT: '${{ runner.temp }}/connectcv-portfolio-save-qa'
      - name: Verify actual public portfolio routes, visitor controls and transport recovery
        run: node tests/portfolioPublicUi.check.mjs
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
          PORTFOLIO_PUBLIC_QA_OUTPUT: '${{ runner.temp }}/connectcv-portfolio-public-qa'
      - name: Verify interview microphone cancellation, device loss and text fallback
        run: node tests/interviewMicUi.check.cjs
        working-directory: backend/features/connectcv
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
          INTERVIEW_MIC_QA_OUTPUT: '${{ runner.temp }}/connectcv-interview-mic-qa'
      - name: Verify community receipt retry, authoritative balance and retained newer drafts
        run: node tests/communityReceiptUi.check.cjs
        working-directory: backend/features/connectcv
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
          RECEIPT_UI_QA_OUTPUT: '${{ runner.temp }}/connectcv-community-receipt-qa'
      - name: Verify interview voice cancellation, late playback and delayed microphone resume
        run: node tests/interviewVoiceUi.check.cjs
        working-directory: backend/features/connectcv
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
          INTERVIEW_VOICE_QA_OUTPUT: '${{ runner.temp }}/connectcv-interview-voice-qa'
      - name: Verify interview session ownership across transcription, replies and departure
        run: node tests/interviewSessionUi.check.cjs
        working-directory: backend/features/connectcv
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
          INTERVIEW_SESSION_QA_OUTPUT: '${{ runner.temp }}/connectcv-interview-session-qa'
      - name: Verify community public consent across edits, actor changes and token wait
        run: node tests/communityConsentUi.check.mjs
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
          COMMUNITY_CONSENT_QA_OUTPUT: '${{ runner.temp }}/connectcv-community-consent-qa'
      - name: Verify portfolio delete ownership, retained private draft and mutation locking
        run: node tests/portfolioDeleteUi.check.mjs
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
          PORTFOLIO_DELETE_QA_OUTPUT: '${{ runner.temp }}/connectcv-portfolio-delete-qa'
      - name: Verify signup followups stop after departure or SDK user replacement
        run: node tests/signupLifecycleUi.check.mjs
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
          SIGNUP_LIFECYCLE_QA_OUTPUT: '${{ runner.temp }}/connectcv-signup-lifecycle-qa'
      - name: Verify CV export ownership, duplicate locking and bounded retry
        run: node tests/cvExportLifecycleUi.check.cjs
        working-directory: backend/features/connectcv
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
          CV_EXPORT_LIFECYCLE_QA_OUTPUT: '${{ runner.temp }}/connectcv-export-lifecycle-qa'
