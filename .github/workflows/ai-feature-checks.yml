name: ConnectCV independent checks
'on':
  push:
    branches: [main, 'improvement/**']
    paths-ignore: ['docs/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: connectcv-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --omit=dev
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: node --test tests/authFlow.test.js tests/portfolioLoader.test.js
        working-directory: frontend
      - run: node --test tests/account.test.cjs tests/portfolio.test.cjs tests/profileConflict.test.cjs tests/renderBrowser.test.cjs
        working-directory: backend
      - run: npm test
        working-directory: backend/features/connectcv
      - run: npm audit --audit-level=moderate
        working-directory: backend
      - run: npm audit --audit-level=moderate
        working-directory: frontend
      - run: npm audit --audit-level=moderate
        working-directory: backend/features/connectcv
  pdf-renderer:
    # Chromium's user namespace sandbox needs a compatible host policy.
    # Keep sandbox enabled; do not disable AppArmor or change host sysctls.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --omit=dev
        working-directory: backend/features/connectcv
      - name: Install pinned Chromium for sandboxed PDF verification
        run: node node_modules/playwright-core/cli.js install --with-deps --no-shell chromium
        working-directory: backend/features/connectcv
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
      - name: Verify production sandbox, isolated resources and PDF text
        run: node tests/pdfRenderer.check.cjs
        working-directory: backend/features/connectcv
        env:
          NODE_ENV: production
          PLAYWRIGHT_BROWSERS_PATH: '0'
