name: ConnectCV independent checks
'on':
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: connectcv-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --omit=dev
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: node --test tests/account.test.cjs
        working-directory: backend
      - run: npm test
        working-directory: backend/features/connectcv
      - run: npm audit --audit-level=moderate
        working-directory: backend
      - run: npm audit --audit-level=moderate
        working-directory: frontend
      - run: npm audit --audit-level=moderate
        working-directory: backend/features/connectcv
