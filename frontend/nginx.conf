# =========================================================================
# nginx.conf v2 — Security Hardened
# ✅ Security headers trên cả main server (trước thiếu)
# ✅ Proxy timeout để tránh backend treo làm nginx treo
# ✅ Gzip compression
# ✅ Rate limit hint headers
# =========================================================================

# ─── 1. Subdomain Portfolio ─────────────────────────────────────────────
server {
    listen 80;
    server_name ~^(?<username>[a-zA-Z0-9_-]+)\.connectcv\.io\.vn$ ~^(?<username>[a-zA-Z0-9_-]+)\.localhost$;

    root /usr/share/nginx/html/portfolios/$username;
    index index.html;

    # Security Headers
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline'; img-src 'self' data: https:; font-src https://fonts.gstatic.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.tailwindcss.com https://cdnjs.cloudflare.com; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; frame-ancestors 'none';" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /index.html =404;
    }
}

# ─── 2. Main ConnectCV Application ──────────────────────────────────────
server {
    listen 80 default_server;
    server_name localhost connectcv.io.vn www.connectcv.io.vn;

    client_max_body_size 10M;   # Giảm từ 50M xuống 10M (audio max ~8MB)

    root /usr/share/nginx/html;
    index index.html;

    # ✅ FIX: Security Headers trên main server (trước đây hoàn toàn thiếu!)
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(self)" always;
    add_header Content-Security-Policy   "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: https: blob:; media-src 'self' blob:; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; connect-src 'self' https://generativelanguage.googleapis.com;" always;

    # Gzip compression — giảm bandwidth ~60–70%
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;

    # Portfolio path routing
    location ~ ^/p/(?<user>[a-zA-Z0-9_-]+)(/.*)?$ {
        alias /usr/share/nginx/html/portfolios/$user/;
        index index.html;
        try_files $2 $2/ /index.html =404;
    }

    location ~ ^/portfolios/(?<user>[a-zA-Z0-9_-]+)(/.*)?$ {
        alias /usr/share/nginx/html/portfolios/$user/;
        index index.html;
        try_files $2 $2/ /index.html =404;
    }

    # Main SPA
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options          "SAMEORIGIN" always;
        add_header X-Content-Type-Options   "nosniff" always;
        add_header X-XSS-Protection         "1; mode=block" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy  "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: https: blob:; media-src 'self' blob:; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; connect-src 'self' https://generativelanguage.googleapis.com;" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Static assets — cache aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 7d;
        add_header X-Content-Type-Options   "nosniff" always;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # ✅ FIX: API proxy với timeout (trước thiếu → backend treo = nginx treo)
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # ✅ Timeouts — tránh Nginx treo khi Gemini chậm
        proxy_connect_timeout   10s;
        proxy_send_timeout      60s;
        proxy_read_timeout      60s;
    }

    location /health {
        proxy_pass http://backend:5000/health;
        proxy_read_timeout 5s;
    }
}
